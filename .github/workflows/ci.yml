name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crate:
    name: Verify Rust crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check packaged license
        run: cmp LICENSE crates/ezdwg-core/LICENSE
      - name: Check crates.io package
        run: cargo publish -p ezdwg-core --dry-run --locked
      - name: Test examples from the packaged crate
        run: cargo test --manifest-path target/package/ezdwg-core-*/Cargo.toml --doc --locked
      - name: Build packaged API documentation
        run: cargo doc --manifest-path target/package/ezdwg-core-*/Cargo.toml --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - run: uv run scripts/bump_version.py --check
      - run: uv run --no-project --python 3.11 --with pytest python -m pytest -q tests/test_versioning.py

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        shell: bash
        run: |
          python -m venv .venv
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "VENV_PY=.venv/Scripts/python.exe" >> "${GITHUB_ENV}"
          else
            echo "VENV_PY=.venv/bin/python" >> "${GITHUB_ENV}"
          fi

      - name: Install build tools
        shell: bash
        run: |
          "${VENV_PY}" -m pip install --upgrade pip
          "${VENV_PY}" -m pip install maturin pytest ezdxf matplotlib

      - name: Rust tests
        run: cargo test --all --quiet

      - name: Python smoke tests (maturin develop)
        shell: bash
        run: |
          "${VENV_PY}" -m maturin develop --release
          "${VENV_PY}" -c "import ezdwg; doc = ezdwg.read('examples/data/line_2000.dwg'); assert doc.version == 'AC1015'; print(doc.version)"
          "${VENV_PY}" -c "import ezdwg; doc = ezdwg.read('test_dwg/line_2007.dwg'); assert doc.version == 'AC1021'; assert doc.decode_version == 'AC1021'; assert sum(1 for _ in doc.modelspace().query('LINE')) == 1; print(doc.decode_version)"
          "${VENV_PY}" -m ezdwg inspect test_dwg/line_2007.dwg
          "${VENV_PY}" examples/basic_read.py
          "${VENV_PY}" -m pytest -q tests

      - name: Build wheel
        shell: bash
        run: |
          rm -f src/ezdwg/_core.pyd src/ezdwg/_core.so src/ezdwg/_core.abi3.so src/ezdwg/_core.dll src/ezdwg/_core.dylib
          "${VENV_PY}" -m maturin build --release --out dist
          "${VENV_PY}" -c "from pathlib import Path; wheels = list(Path('dist').glob('*.whl')); assert wheels, 'no wheel produced'; print(wheels[0].name)"
